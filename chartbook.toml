[project]
name = "Treasury-Swap Arbitrage Spreads"
description = "Treasury-Swap basis measuring arbitrage opportunities between Treasury yields and swap rates"
contributors = [
    "Jeremy Bejarano",
]
repo_url = "https://github.com/ftsfr/basis_treas_swap"
copyright = "2025"
os_compatibility = [
    "Windows/Linux/MacOS (requires Bloomberg)",
]
requires_chartbook = ">=0.3.0"

[scripts]
build = "doit"

[notebooks.summary_treasury_swap_basis]
name = "summary_treasury_swap_basis"
description = "Summary statistics and visualization of Treasury-Swap basis"
path = "_output/summary_treasury_swap_basis.ipynb"
publishable = true

[dataframes.ftsfr_treasury_swap_basis]
name = "ftsfr_treasury_swap_basis"
description = "Daily Treasury-Swap arbitrage spreads for 7 tenors"
sources = [
    "Bloomberg Treasury Yields",
    "Bloomberg Swap Rates",
]
providers = [
    "Bloomberg",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://bloomberg.com",
]
tags = [
    "Treasury",
    "Swap",
    "basis",
    "arbitrage",
    "fixed income",
]
access_types = [
    "Bloomberg Terminal",
]
license = "Bloomberg"
restrictions = "No"
pull_method = "Pulled from Bloomberg via xbbg"
path = "./_data/ftsfr_treasury_swap_basis.parquet"
date_col = "ds"
docs = """
## Treasury-Swap Basis

Treasury-Swap arbitrage spreads in basis points.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Tenor identifier (e.g., Arb_Swap_1, Arb_Swap_10) |
| ds | Date |
| y | Basis spread in basis points |

### Methodology

$$
\\text{Basis} = (\\text{Treasury Yield} - \\text{Swap Rate}) \\times 100
$$

### Interpretation

- Basis > 0: Treasuries yield more than swaps
- Basis < 0: Swaps yield more than Treasuries
- Basis = 0: No arbitrage opportunity

### Series

Arb_Swap_1, Arb_Swap_2, Arb_Swap_3, Arb_Swap_5, Arb_Swap_10, Arb_Swap_20, Arb_Swap_30

### Data Source

Bloomberg Treasury constant maturity yields (USGG series) and USD swap rates (USSW series)
"""

[charts.treasury_swap_basis]
name = "Treasury-Swap Basis"
description = "Time series of Treasury-Swap arbitrage spreads by tenor"
dataframe = "ftsfr_treasury_swap_basis"
path = "./_output/replicated_swap_spread_arb_figure.html"
tags = [
    "Treasury",
    "Swap",
    "arbitrage",
    "basis",
]
docs = """
## Treasury-Swap Arbitrage Spreads

Time series plot showing the Treasury-Swap arbitrage spreads across different maturities (1Y, 2Y, 3Y, 5Y, 10Y, 20Y, 30Y).

### Interpretation

- Positive spreads indicate Treasuries yield more than swaps
- Negative spreads indicate swaps yield more than Treasuries
- Spread dynamics reflect funding conditions and balance sheet constraints
"""
